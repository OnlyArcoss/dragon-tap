services:
  db:
    image: postgres:16-alpine
    container_name: dragon-tap-db
    restart: unless-stopped
    env_file:
      - ./cellar/.env
    volumes:
      - cellar:/var/lib/postgresql/data
      - ./cellar/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dragontap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  front:
    build:
      context: ./board-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: dragon-tap-board-react:latest
    container_name: dragon-tap-board-react
    restart: unless-stopped
    networks:
      - dragontap-net

  api:
    build:
      context: ./innkeeper-java
      dockerfile: Dockerfile
    image: dragon-tap-innkeeper-java:latest
    container_name: dragon-tap-innkeeper-java
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./innkeeper-java/.env
    networks:
      - dragontap-net

  proxy:
    image: nginx:stable-alpine
    container_name: dragon-tap-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - api
    networks:
      - dragontap-net

networks:
  dragontap-net:
    driver: bridge

volumes:
  cellar:
    driver: local
