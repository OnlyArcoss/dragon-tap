services:
  cellar:
    image: postgres:16-alpine
    container_name: dragon-tap-cellar
    restart: unless-stopped
    env_file:
      - ./cellar/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cellar/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dragontap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  board:
    build:
      context: ./board-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: dragon-tap-board:latest
    container_name: dragon-tap-board
    restart: unless-stopped
    networks:
      - dragontap-net

  innkeeper:
    build:
      context: ./innkeeper-java
      dockerfile: Dockerfile
    image: dragon-tap-innkeeper:latest
    container_name: dragon-tap-innkeeper
    restart: unless-stopped
    depends_on:
      cellar:
        condition: service_healthy
    env_file:
      - ./cellar/.env
    networks:
      - dragontap-net

  gatekeeper:
    image: nginx:stable-alpine
    container_name: dragon-tap-gatekeeper
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gatekeeper/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - board
      - innkeeper
    networks:
      - dragontap-net

networks:
  dragontap-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
